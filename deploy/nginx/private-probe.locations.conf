# Include ONLY inside the existing auth.liangwendev.com HTTPS server block.
# Pending explicit deployment approval. No root-domain or other vhost changes.
location = /_private_probe_check {
    internal;
    proxy_pass http://127.0.0.1:19090/api/access/probe;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host auth.liangwendev.com;
}
location = /apps/probe { return 302 /apps/probe/; }
location = /apps/probe/api { return 404; }
location ^~ /apps/probe/api/ {
    auth_request /_private_probe_check;
    proxy_pass http://127.0.0.1:19130;
    proxy_pass_request_headers off;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host auth.liangwendev.com;
    add_header Cache-Control "no-store" always;
}
location ^~ /apps/probe/ {
    auth_request /_private_probe_check;
    error_page 401 = @private_probe_login;
    proxy_pass http://127.0.0.1:19130;
    proxy_pass_request_headers off;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host auth.liangwendev.com;
    add_header Cache-Control "no-store" always;
}
location @private_probe_login {
    # Prefix a fixed local path. The application validates it after login.
    return 302 /sso/start$request_uri;
}
