<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
  <a th:fragment="brand" class="brand" th:href="@{/login}" aria-label="Auth Gateway home">
    <svg class="brand-mark" width="30" height="34" viewBox="0 0 30 34" fill="none" aria-hidden="true"><path d="M3 31V3h24v28M10 31V10h10v21" stroke="currentColor" stroke-width="2.5"/><path d="M15 23v8" stroke="currentColor" stroke-width="2.5"/></svg>
    <span>Auth Gateway<span class="brand-caption">YOUR WORKSPACE, CONNECTED</span></span>
  </a>

  <aside th:fragment="story" class="identity-story" aria-label="About Auth Gateway">
    <div th:replace="~{fragments/identity :: brand}"></div>
    <div class="story-copy">
      <p class="overline"><span class="small-rule"></span> ONE ACCOUNT. MORE POSSIBILITIES.</p>
      <h2>Your work.<br>Your world.<br><em>One way in.</em></h2>
      <p>A single starting point for the tools<br class="desktop-break"> that move you forward.</p>
    </div>
    <div class="gateway-art" aria-hidden="true">
      <svg viewBox="0 0 560 430" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="stone" x1="188" y1="80" x2="371" y2="415" gradientUnits="userSpaceOnUse"><stop stop-color="#e8b28c"/><stop offset="1" stop-color="#bd7653"/></linearGradient>

        <path d="M31 365 290 224 550 365M93 397l258-142M162 430l258-142M106 325l252 137M177 286l252 137" stroke="#4b4e49" stroke-width=".7"/>

        <path d="M150 365V172c0-70 40-112 94-112 55 0 94 42 94 112v193h-47V175c0-39-18-65-47-65-28 0-47 26-47 65v190h-47Z" fill="url(#stone)"/>
        <path d="m197 365 44-26V175c0-24 6-44 16-56-4-6-8-9-13-9-28 0-47 26-47 65v190Z" fill="url(#interior)"/>
        <path d="M150 365V172c0-70 40-112 94-112 55 0 94 42 94 112v193" stroke="#f0c3a0" stroke-opacity=".5"/>
        <path d="m338 365 40-23V150c0-68-48-106-95-106" stroke="#b7805d" stroke-opacity=".35"/>
        <path d="M402 190h51m-25-25v50" stroke="#8d948a" stroke-width=".8"/>
        <circle cx="92" cy="222" r="3" fill="#c2c7bc"/>
        <path d="M92 232v42m-5 0h10" stroke="#777e73" stroke-width=".8"/>
        <path d="M176 390h125" stroke="#a3aa9b" stroke-width=".7"/><path d="m176 386-4 4 4 4m125-8 4 4-4 4" stroke="#a3aa9b" stroke-width=".7"/>
      </svg>
      <span class="art-caption">A SPACE FOR EVERYTHING YOU DO</span>
    </div>
    <div class="story-footer"><span>Designed around you.</span><span class="story-index">01 / ACCESS</span></div>
  </aside>

  <svg th:fragment="google" width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65Z"/><path fill="#FBBC05" d="M10.53 28.59A14.41 14.41 0 0 1 9.77 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.87 23.87 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>

  <svg th:fragment="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <svg th:fragment="lock" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

  <footer th:fragment="footer" class="identity-footer"><span>Auth Gateway</span><span>Identity, made simple.</span></footer>

</html>
