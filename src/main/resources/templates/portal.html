<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
  <title>私人导航 · Wen</title><link rel="stylesheet" th:href="@{/portal.css}"><script defer th:src="@{/portal.js}"></script>
</head>
<body><div class="shell">
  <header class="topbar">
    <a href="/" class="brand"><span class="monogram">W</span><span>WEN / WORKSPACE</span></a>
    <div class="account"><span class="account-dot"></span><span th:text="${email}">owner@example.test</span>
      <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="quiet" type="submit">退出</button></form>
    </div>
  </header>
  <main>
    <section class="intro"><p class="eyebrow">PERSONAL / PRIVATE</p><h1>我的工作台<span class="title-dot">.</span></h1><p>常用入口，集中在这里。<span class="welcome" th:text="${displayName}">Wen</span></p></section>
    <section class="toolbar" aria-label="搜索和筛选"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="搜索名称或描述…" aria-label="搜索应用"><kbd>/</kbd></label><span class="result-count" id="count" aria-live="polite"></span></section>
    <nav id="filters" class="filters" aria-label="分类"><button type="button" data-category="" aria-pressed="true">全部</button></nav>
    <section id="apps" class="apps" aria-label="应用入口">
      <a class="app" th:each="app : ${apps}" th:href="${app.url}" th:attr="data-category=${categories[app.id] ?: (app.id == 'probe' ? '测试' : '应用')}">
        <span class="app-icon" th:text="${#strings.substring(app.name,0,1)}">T</span><span class="app-copy"><strong th:text="${app.name}">测试应用</strong><span th:text="${app.description}">明确标记的测试数据</span></span><span class="tag" th:text="${categories[app.id] ?: (app.id == 'probe' ? '测试' : '应用')}">测试</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>
    <p id="empty" class="empty" hidden>没有匹配的入口。换个关键词试试。</p>
    <footer><span><span class="lock" aria-hidden="true">▣</span> 仅本人可见</span><span>统一认证 · Google</span></footer>
  </main>
</div></body></html>
